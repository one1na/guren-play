    <title>蛊真人 · 回合制蛊虫</title>
    <script>
      // 宿主熵源：整站唯一读取宿主随机源的地方。
      //
      // `src/**` 被 test/ironlaw.test.ts 静态禁止宿主随机源与时钟，
      // 所以这里由 HTML（宿主边界）注入取种子的钩子，src/ 只负责调用与兜底，
      // 自己一行随机数都没有。种子随后会显示给玩家，可用同一颗种子复现这一局。
      window.__gurenHostSeed = function () {
        var buf = new Uint32Array(1);
        globalThis.crypto.getRandomValues(buf);
        return buf[0] >>> 0;
      };
    </script>
